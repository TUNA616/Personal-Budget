<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.twelvedata.com https://finnhub.io https://apis.data.go.kr; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>내 가계부 분석기</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f4;--surface:#fcfcfb;--surface-2:#f0efec;--border:#e2e1dc;--grid:#e8e7e3;
  --text:#0b0b0b;--text-2:#52514e;--muted:#767570;
  --accent:#2a78d6;--accent-ink:#ffffff;
  --s1:#2a78d6;--s2:#eb6834;
  --good:#1a7f37;--warn:#9a6700;--serious:#c2410c;--crit:#c62828;
  --good-bg:#e9f5ec;--warn-bg:#fbf3dc;--serious-bg:#fdeee4;--crit-bg:#fdeaea;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#111110;--surface:#1a1a19;--surface-2:#242422;--border:#33322f;--grid:#2c2b29;
    --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8e86;
    --accent:#3987e5;--accent-ink:#ffffff;
    --s1:#3987e5;--s2:#d95926;
    --good:#3fb950;--warn:#d29922;--serious:#f0883e;--crit:#f85149;
    --good-bg:#16261b;--warn-bg:#2a2210;--serious-bg:#2c1a10;--crit-bg:#2d1414;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .lockdot{font-size:11px;font-weight:500;color:var(--good);background:var(--good-bg);border-radius:99px;padding:2px 8px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--text-2)}
nav.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--text);font-weight:600}
.btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--border))}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1{font-size:22px;margin:24px 0 4px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--text-2);margin:0 0 16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .label{color:var(--text-2);font-size:12px}
.kpi .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .note{font-size:12px;color:var(--muted);margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2)}
.field > input,.field > select{color:var(--text);font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--text-2);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.num,th.num{text-align:right}
td.desc{white-space:normal;min-width:180px;max-width:360px}
tr.excluded td{color:var(--muted)}
tr:last-child td{border-bottom:0}
td select{padding:3px 6px;font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--text-2);margin-left:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;border-radius:8px;padding:3px 9px;font-size:13px}
.status.good{color:var(--good);background:var(--good-bg)}
.status.warning{color:var(--warn);background:var(--warn-bg)}
.status.serious{color:var(--serious);background:var(--serious-bg)}
.status.critical{color:var(--crit);background:var(--crit-bg)}
.advice{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.advice:first-of-type{border-top:0}
.advice .ico{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--surface-2);color:var(--text-2)}
.advice .ico.critical{background:var(--crit-bg);color:var(--crit)}
.advice .ico.serious{background:var(--serious-bg);color:var(--serious)}
.advice .ico.warning{background:var(--warn-bg);color:var(--warn)}
.advice .ico.good{background:var(--good-bg);color:var(--good)}
.advice .t{font-weight:600}
.advice ul{margin:6px 0 0;padding-left:18px;color:var(--text-2)}
.catbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;padding:5px 0}
.catbar .track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.catbar .fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.catbar .v{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;min-width:120px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:3}
.tip b{display:block;margin-bottom:2px}
.lock{max-width:440px;margin:10vh auto 0;padding:0 16px}
.lock .card{padding:24px}
.lock input{width:100%;margin-top:6px}
.err{color:var(--crit);font-size:13px;min-height:18px;margin-top:6px}
.notice{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast .btn{background:transparent;color:inherit;border-color:currentColor}
.empty{text-align:center;padding:40px 16px;color:var(--text-2)}
details summary{cursor:pointer;color:var(--text-2);font-size:12px;margin-top:8px}
.pos{color:var(--good)} .neg{color:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:2px 4px 2px 10px;margin:2px;font-size:12px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;color:var(--text-2)}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
@media (max-width:640px){ header.top{position:static} nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%} .kpi .val{font-size:18px} th,td{padding:6px 8px} }
</style>
</head>

const VAULT_KEY = 'my-ledger-vault-v1';

// ---------- 분류 엔진 ----------
function accMap() { return Object.fromEntries(S.accounts.map(a => [a.id, a])); }
function autoCategory(t, acc) {
  const d = U(t.desc + ' ' + (t.memo || ''));
  const dir = (acc && acc.type === 'card') ? 'out' : (t.amount >= 0 ? 'in' : 'out');
  for (const r of S.rules) { if (r.dir === dir && r.kw && d.includes(U(r.kw))) return r.cat; }
  if (dir === 'out' && CARD_RE.test(d)) return '카드대금';
  return dir === 'in' ? '기타수입' : '기타지출';
}
function classifyAll() {
  const A = accMap();
  const hasCard = S.accounts.some(a => a.type === 'card');
  const names = S.settings.ownerNames.map(U).filter(Boolean);
  const hints = S.settings.ownAccountHints.map(U).filter(Boolean);
  const kws = S.settings.transferKeywords.map(U).filter(Boolean);
  for (const t of S.txns) {
    const acc = A[t.accountId];
    if (!t.catManual) t.category = autoCategory(t, acc);
    if (t.kindManual) continue;
    t.pairId = null; t.reason = '';
    if (acc && acc.type === 'card') { t.kind = 'expense'; continue; }
    let kind = t.amount >= 0 ? 'income' : 'expense';
    const d = U(t.desc + ' ' + (t.memo || ''));
    if (names.some(n => d.includes(n))) { kind = 'transfer'; t.reason = '본인 이름'; }
    else if (hints.some(n => d.includes(n))) { kind = 'transfer'; t.reason = '내 계좌 정보'; }
    else if (kws.some(n => d.includes(n))) { kind = 'transfer'; t.reason = '이체 키워드'; }
    else if (acc && acc.type === 'securities') { kind = 'transfer'; t.reason = '증권계좌 입출금'; }
    else if (t.amount < 0 && CARD_RE.test(d) && hasCard) { kind = 'card_payment'; t.reason = '카드내역을 따로 불러와서 중복 방지'; }
    t.kind = kind;
  }
  // 짝 매칭: 서로 다른 내 계좌 사이에 같은 금액이 나가고 들어온 경우
  const days = S.settings.pairDays;
  const pool = S.txns.filter(t => !t.kindManual && Math.abs(t.amount) >= 1000 && A[t.accountId] && A[t.accountId].type !== 'card' &&
    (t.kind === 'income' || t.kind === 'expense' || (A[t.accountId].type === 'securities' && t.reason === '증권계좌 입출금')));
  const ins = pool.filter(t => t.amount > 0);
  const used = new Set();
  const dnum = s => Date.parse(s + 'T00:00:00Z') / 86400000;
  for (const o of pool.filter(t => t.amount < 0)) {
    let best = null, bd = 1e9;
    for (const i of ins) {
      if (used.has(i.id) || i.accountId === o.accountId || i.amount !== -o.amount) continue;
      const dd = Math.abs(dnum(i.date) - dnum(o.date));
      if (dd <= days && dd < bd) { best = i; bd = dd; }
    }
    if (best) {
      used.add(best.id); const pid = uid();
      for (const t of [o, best]) { t.kind = 'transfer'; t.pairId = pid; t.reason = '같은 금액이 내 다른 계좌로 이동'; }
    }
  }
}
function spendOf(t) { return t.kind === 'expense' ? -t.amount : 0; }
function incOf(t) { return t.kind === 'income' ? t.amount : 0; }
function months() { return [...new Set(S.txns.map(t => t.date.slice(0, 7)))].sort(); }
function summary(mk) {
  const ts = S.txns.filter(t => t.date.startsWith(mk));
  const byCat = {}, incCat = {};
  let inc = 0, exp = 0, trSum = 0, trN = 0, cpSum = 0, cpN = 0;
  for (const t of ts) {
    if (t.kind === 'expense') { const v = -t.amount; exp += v; byCat[t.category] = (byCat[t.category] || 0) + v; }
    else if (t.kind === 'income') { inc += t.amount; incCat[t.category] = (incCat[t.category] || 0) + t.amount; }
    else if (t.kind === 'transfer') { if (t.amount < 0 || !t.pairId) { trSum += Math.abs(t.amount); } trN++; }
    else if (t.kind === 'card_payment') { cpSum += -t.amount; cpN++; }

}
function prevMonths(mk, n) { const [y, m] = mk.split('-').map(Number); const out = []; for (let i = 1; i <= n; i++) { const d = new Date(Date.UTC(y, m - 1 - i, 1)); out.push(d.toISOString().slice(0, 7)); } return out; }

// ---------- 지출 진단 & 솔루션 ----------
function normMerchant(s) { return U(s).replace(/[0-9\s\-_.(),*#/\\:;'"[\]]+/g, '').replace(/(주식회사|\(주\)|㈜)/g, '').slice(0, 24); }

  const ms = new Set([endMk, ...prevMonths(endMk, 5)]);

  for (const t of S.txns) {
    if (t.kind !== 'expense' || t.amount >= 0 || !ms.has(t.date.slice(0, 7))) continue;
    const k = normMerchant(t.desc); if (!k) continue;
    (groups[k] = groups[k] || []).push(t);
  }
  const out = [];
  for (const [k, ts] of Object.entries(groups)) {
    const byM = {}; ts.forEach(t => { const m = t.date.slice(0, 7); (byM[m] = byM[m] || []).push(-t.amount); });
    const mlist = Object.keys(byM);
    if (mlist.length < 2 || Object.values(byM).some(a => a.length > 2)) continue;
    const amts = Object.values(byM).map(a => sum(a));
    const mx = Math.max(...amts), mn = Math.min(...amts);
    if (mn <= 0 || mx / mn > 1.15) continue;
    out.push({ name: ts[ts.length - 1].desc, cat: ts[0].category, monthly: mean(amts), months: mlist.length, inLatest: !!byM[endMk] });

function buildAdvice(mk) {
  const target = S.settings.targetSavings / 100;
  const cur = summary(mk);
  const thisM = todayStr().slice(0, 7);
  const hist = [mk, ...prevMonths(mk, 2)].filter(m => S.txns.some(t => t.date.startsWith(m)) && (m !== thisM || m === mk && prevMonths(mk, 2).every(x => !S.txns.some(t => t.date.startsWith(x))))).map(summary);
  const useAvg = hist.length >= 2;
  const base = useAvg ? { inc: mean(hist.map(x => x.inc)), exp: mean(hist.map(x => x.exp)), label: `최근 ${hist.length}개월 평균${hist.some(x => x.mk === mk) ? '' : ' (진행 중인 이번 달 제외)'}` } : { inc: cur.inc, exp: cur.exp, label: '이번 달' };
  let ratio = base.inc > 0 ? base.exp / base.inc : (base.exp > 0 ? Infinity : 0);

    base.note = `${base.label}: 수입 대비 지출 ${pct(ratio)}`; base.inc = cur.inc; base.exp = cur.exp; base.label = '이번 달'; ratio = cur.exp / cur.inc;
  }
  let level, title;
  if (base.inc <= 0 && base.exp <= 0) { level = 'good'; title = '분석할 데이터가 아직 없어요'; }
  else if (base.inc <= 0) { level = 'critical'; title = `${base.label}에 수입 기록이 없어요 (지출 ${won(base.exp)})`; }
  else if (ratio >= 1) { level = 'critical'; title = `지출이 수입보다 많아요 (수입 대비 ${pct(ratio)})`; }
  else if (ratio >= 0.9) { level = 'serious'; title = `지출이 수입과 거의 같아요 (수입 대비 ${pct(ratio)})`; }
  else if (ratio > 1 - target) { level = 'warning'; title = `저축률이 목표(${S.settings.targetSavings}%)보다 낮아요 (현재 ${pct(1 - ratio)})`; }
  else { level = 'good'; title = `건강한 편이에요 — 저축률 ${pct(1 - ratio)}`; }
  if (base.note) title += ` · ${base.note}`;

    const vsum = sum(variable.map(x => x[1]));

    }
    if (needCut - covered > 20000) lines.push(`변동비만으로는 ${man(needCut - covered)}원이 부족해요. 고정비(주거·통신·보험) 재점검이나 수입 확대가 필요해요.`);
    items.push({ lv: level, t: `목표 저축률 ${S.settings.targetSavings}%까지 월 ${won(needCut)} 줄이기`, d: `${base.label} 기준 수입 ${won(base.inc)}, 지출 ${won(base.exp)}. 고정비는 그대로 두고, 큰 변동비부터 최대 40%까지만 줄이는 현실적인 안이에요.`, ul: lines });

  if (subs.length) {

function loadSample() {
  const mk = (n, type) => { const a = { id: uid(), name: n, type, sample: true }; S.accounts.push(a); return a.id; };
  const bank = mk('(샘플) 주거래 은행', 'bank'), toss = mk('(샘플) 인터넷은행', 'bank'), card = mk('(샘플) 신용카드', 'card'), sec = mk('(샘플) 증권계좌', 'securities');
  const now = new Date(); const L = { [bank]: [], [toss]: [], [card]: [], [sec]: [] };
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const D = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(Math.min(d, 28)).padStart(2, '0')}`;
  for (let k = 4; k >= 0; k--) {
    const dt = new Date(now.getFullYear(), now.getMonth() - k, 1); const y = dt.getFullYear(), m = dt.getMonth() + 1;
    const lastDay = k === 0 ? Math.max(1, now.getDate()) : 28;
    const heavy = k <= 1 ? 1.45 : 1;
    if (25 <= lastDay) L[bank].push({ date: D(y, m, 25), time: '09:00', amount: 2200000, desc: '학생인건비 ○○대학교' });
    if (10 <= lastDay) L[bank].push({ date: D(y, m, 10), time: '10:00', amount: 300000, desc: '용돈 엄마' });
    if (1 <= lastDay) L[bank].push({ date: D(y, m, 1), time: '08:00', amount: -450000, desc: '월세 김OO' });
    if (5 <= lastDay) L[bank].push({ date: D(y, m, 5), time: '07:00', amount: -1150000 * heavy | 0, desc: '○○카드 결제대금' });
    if (26 <= lastDay) { L[bank].push({ date: D(y, m, 26), time: '12:00', amount: -300000, desc: '본인이체 인터넷은행' }); L[toss].push({ date: D(y, m, 26), time: '12:00', amount: 300000, desc: '본인이체 주거래' }); }
    if (27 <= lastDay) { L[bank].push({ date: D(y, m, 27), time: '13:10', amount: -200000, desc: '○○증권 0012' }); L[sec].push({ date: D(y, m, 27), time: '13:10', amount: 200000, desc: '입금' }); }
    if (20 <= lastDay) L[toss].push({ date: D(y, m, 20), time: '09:30', amount: -100000, desc: '자유적금 납입' });
    const subs = [['넷플릭스', 13500, 3], ['유튜브프리미엄', 14900, 8], ['멜론', 10900, 12], ['OPENAI *CHATGPT', 29000, 15], ['OO헬스장', 70000, 2], ['SKT 통신요금', 55000, 21]];
    for (const [n, a, d] of subs) if (d <= lastDay) L[card].push({ date: D(y, m, d), time: '09:00', amount: -a, desc: n });
    const pool = [['배달의민족', 18000, 26000], ['쿠팡이츠', 16000, 24000], ['스타벅스 ○○점', 4500, 7000], ['메가커피 ○○점', 2000, 4500], ['GS25 ○○점', 1500, 6000], ['CU ○○점', 1200, 5000], ['학생식당', 5000, 6500], ['김밥천국', 6000, 9000], ['카카오T 택시', 6000, 15000], ['쿠팡', 12000, 45000], ['무신사', 30000, 80000], ['이마트 ○○점', 25000, 60000], ['CGV ○○점', 14000, 15000], ['올리브영', 10000, 30000], ['교보문고', 15000, 30000], ['약국', 4000, 12000]];
    const n = Math.round(42 * heavy * (lastDay / 28));
    for (let i = 0; i < n; i++) {
      const [nm, lo, hi] = pool[Math.floor(rnd() * pool.length)]; const d = 1 + Math.floor(rnd() * lastDay);
      const hr = 8 + Math.floor(rnd() * 17) % 24; L[card].push({ date: D(y, m, d), time: `${String(hr).padStart(2, '0')}:${String(Math.floor(rnd() * 60)).padStart(2, '0')}`, amount: -Math.round((lo + rnd() * (hi - lo)) / 100) * 100, desc: nm });
    }
    if (k === 1 && 14 <= lastDay) L[card].push({ date: D(y, m, 14), time: '20:00', amount: -320000, desc: '○○항공' });
  }
  for (const [id, list] of Object.entries(L)) addTxns(list, id, { sample: true });
  S.holdings.push({ id: uid(), name: '(샘플) 삼성전자', market: 'KR', symbol: '005930', qty: 10, avg: 71000, price: 76500, priceSrc: '직접 입력', priceAt: new Date().toISOString(), sample: true });
  S.holdings.push({ id: uid(), name: '(샘플) 애플', market: 'US', symbol: 'AAPL', qty: 3, avg: 190, price: 228, priceSrc: '직접 입력', priceAt: new Date().toISOString(), sample: true });

}
